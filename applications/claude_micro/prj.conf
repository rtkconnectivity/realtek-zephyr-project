# ── Sample rate (choose one) ──────────────────────────────────────────────────
# NOTE: 48K also needs sampling-frequencies = <48000> in the board overlay
#       and CONFIG_I2S_BEE_RX_BLOCK_SIZE_MAX=1024.
CONFIG_APP_UAC_SAMPLE_RATE_16K=y
# CONFIG_APP_UAC_SAMPLE_RATE_48K=y

# ── Logging ───────────────────────────────────────────────────────────────────
CONFIG_LOG=y
CONFIG_APP_LOG_LEVEL=3

# ── GPIO / Button / RGB LED ───────────────────────────────────────────────────
CONFIG_GPIO=y

# ── I2S / Audio codec ─────────────────────────────────────────────────────────
CONFIG_I2S=y
CONFIG_I2S_BEE_RX=y
CONFIG_AUDIO=y
CONFIG_AUDIO_CODEC=y

# ── DMA (required by Bee I2S driver) ─────────────────────────────────────────
CONFIG_DMA=y

# ── USB Device stack (device_next) ────────────────────────────────────────────
CONFIG_USB_DEVICE_STACK_NEXT=y
CONFIG_RING_BUFFER=y
# Run the DWC2 controller in full speed only
CONFIG_UDC_DRIVER_HIGH_SPEED_SUPPORT_ENABLED=n

# UAC2 microphone
CONFIG_USBD_AUDIO2_CLASS=y

# HID (button reports + LED state output)
CONFIG_USBD_HID_SUPPORT=y

CONFIG_USBD_LOG_LEVEL_WRN=y
CONFIG_UDC_DRIVER_LOG_LEVEL_WRN=y
CONFIG_USBD_HID_LOG_LEVEL_WRN=y
CONFIG_USBD_UAC2_LOG_LEVEL_WRN=y

# ── Kernel / heap ─────────────────────────────────────────────────────────────
CONFIG_HEAP_MEM_POOL_SIZE=8192
CONFIG_MAIN_STACK_SIZE=2048
CONFIG_SYSTEM_WORKQUEUE_STACK_SIZE=2048

# ── Console (UART2 @ 2M, see overlay) ─────────────────────────────────────────
CONFIG_UART_CONSOLE=y
