manifest:
  self:
    path: realtek-zephyr-project
    west-commands: tool/west-commands.yml
  
  defaults:
    remote: upstream

  remotes:
    - name: rtkconnectivity
      url-base: https://github.com/rtkconnectivity
    - name: upstream
      url-base: https://github.com/zephyrproject-rtos

  projects:
    - name: zephyr
      remote: upstream
      revision: main
      import:
        name-allowlist:
          - cmsis
          - cmsis_6
          - hal_realtek
          - tinycrypt
