manifest:
  self:
    path: realtek-zephyr-project
    west-commands: tool/west-commands.yml

  remotes:
    - name: rtkconnectivity
      url-base: https://github.com/rtkconnectivity
    - name: zephyr
      url-base: https://github.com/zephyrproject-rtos

  defaults:
    remote: rtkconnectivity

  projects:
    - name: zephyr
      remote: rtkconnectivity
      revision: 6247fe90ac3a6e0c0b1e3f54c36fffe7a1d14515
      import:
        name-allowlist:
          - cmsis
          - cmsis_6
          - hal_realtek
          - mbedtls
          - tf-psa-crypto
          - segger
          - cmsis-dsp
          - cmsis-nn
          - mldsa-native
          - littlefs
          - fatfs
          - mcuboot
          - zcbor
          - mipi-sys-t

    #
    # Realtek based overrides of hal_realtek, mcuboot and tf-psa-crypto modules
    #
    - name: hal_realtek
      remote: rtkconnectivity
      revision: b8fc291cd8b14a04ee98a67138155843349cf6ca
      path: modules/hal/realtek
      groups:
        - hal

    - name: mcuboot
      remote: rtkconnectivity
      repo-path: zephyr-mcuboot
      revision: 404200c659691138b1bb3cee6f454f427d282199
      path: bootloader/mcuboot
      groups:
        - bootloader

    - name: tf-psa-crypto
      remote: rtkconnectivity
      repo-path: zephyr-tf-psa-crypto
      revision: 99d2472985a3d426c02990efb8a6047df4da8f03
      path: modules/crypto/tf-psa-crypto
      groups:
        - crypto
