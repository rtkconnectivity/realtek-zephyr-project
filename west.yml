manifest:
  self:
    path: realtek-zephyr-project
    west-commands: tool/west-commands.yml

  remotes:
    - name: rtkconnectivity
      url-base: https://github.com/rtkconnectivity

  defaults:
    remote: rtkconnectivity

  projects:
    - name: zephyr
      remote: rtkconnectivity
      revision: realtek-main-v3.7
      import:
        name-allowlist:
          - cmsis
          - hal_realtek
          - tinycrypt
          - openthread
          - mbedtls

    #
    # Realtek based overrides of hal_realtek modules
    #
    - name: hal_realtek
      remote: rtkconnectivity
      revision: hal_realtek_v3.5_v3.7
      path: modules/hal/realtek
      groups:
        - hal
